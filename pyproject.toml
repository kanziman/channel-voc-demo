[project]
name = "channel-voc-intelligence"
version = "0.2.0"
description = "VOC Intelligence Dept — PHASE2: Root-Cause GraphRAG (LangChain · LangGraph · Neo4j)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # ── PHASE2: agentic root-cause GraphRAG ──
    "langchain>=0.3.30",
    "langchain-openai>=0.3.35",       # OpenRouter (OpenAI-compatible) chat/extraction
    "langchain-neo4j>=0.3.0",
    "langchain-community>=0.3.0",      # SQLite LLM cache
    "langgraph>=0.2.0",               # StateGraph + interrupt + checkpointer
    "langgraph-checkpoint-sqlite>=2.0.0",
    # ── PHASE3: FastAPI server wrapping the existing modules (§3.1, §5-2) ──
    "fastapi>=0.115",                 # /api/chat /api/graph /api/search /api/agent
    "uvicorn>=0.30",                  # ASGI server (local dev; Vercel wraps the app)
    "fastembed>=0.4.0",               # local ONNX embeddings (bge-small-en-v1.5, 384d)
    "neo4j>=5.28.0",
    "python-dotenv>=1.0.0",
    # ── PHASE1 baseline (sklearn benchmark arm) ──
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[dependency-groups]
# ── PHASE3: TDD toolchain (pytest 스택) + FastAPI 테스트 클라이언트 ──
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",   # async FastAPI route/agent 테스트
    "httpx>=0.27",            # httpx.AsyncClient / TestClient
    "pytest-cov>=5.0",        # 커버리지 (tdd-green 8단계)
    "mypy>=1.11",             # security-review 타입 검사
    "pip-audit>=2.7",         # security-review 취약점 스캔
    "nbformat>=5.10.4",
    "jupyter-client>=8.9.1",
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
]

[tool.pytest.ini_options]
# PHASE3 TDD: pytest 스택. FastAPI async 라우트/agent 테스트를 위해 asyncio auto 모드.
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-q"

[tool.uv]
# Single unified py3.12 environment (supersedes the PHASE1 py3.11 .venv and the
# neo4j-graphrag learning scaffold). See src/docs/PHASE2_PLAN.md §2.0, §6.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.vercel]
entrypoint = "src/graph/serve.py"

