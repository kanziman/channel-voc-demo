[project]
name = "channel-voc-intelligence"
version = "0.2.0"
description = "VOC Intelligence Dept — PHASE2: Root-Cause GraphRAG (LangChain · LangGraph · Neo4j)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # ── PHASE2: agentic root-cause GraphRAG ──
    "langchain>=0.3.30",
    "langchain-openai>=0.3.35",       # OpenRouter (OpenAI-compatible) chat/extraction
    "langchain-neo4j>=0.3.0",
    "langchain-community>=0.3.0",      # SQLite LLM cache
    "langgraph>=0.2.0",               # StateGraph + interrupt + checkpointer
    "langgraph-checkpoint-sqlite>=2.0.0",
    "fastembed>=0.4.0",               # local ONNX embeddings (bge-small-en-v1.5, 384d)
    "neo4j>=5.28.0",
    "python-dotenv>=1.0.0",
    # ── PHASE1 baseline (sklearn benchmark arm) ──
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[tool.uv]
# Single unified py3.12 environment (supersedes the PHASE1 py3.11 .venv and the
# neo4j-graphrag learning scaffold). See src/docs/PHASE2_PLAN.md §2.0, §6.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
